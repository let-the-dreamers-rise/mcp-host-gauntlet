name: opencode

on:
  push:
    branches: [main, opencode]
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install opencode
        run: |
          npm install -g opencode-ai@1.19.6
          opencode --version
      - name: Run the gauntlet
        run: |
          python -m gauntlet.runner --host opencode --out results/ci --timeout 120
          python -m gauntlet.baseline check results/ci/opencode/summary.json baselines/opencode.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-results
          path: results/ci
